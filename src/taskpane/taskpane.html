<!-- This file shows how to design a first-run page that provides a welcome screen to the user about the features of the add-in. -->

<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inspect The URL!</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <!-- For more information on Fluent UI, visit https://developer.microsoft.com/fluentui#/. -->
    <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"/>

    <!-- Template styles -->
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m ms-welcome ms-Fabric">
    <header class="ms-welcome__header ms-bgColor-neutralLighter">
        <img width="90" height="90" src="../../assets/logo-filled.png" alt="Inspect The URL!" title="Inspect The URL!" />
        <h1 class="ms-font-su">Inspect The URL!</h1>
    </header>
    <main id="app-body" class="ms-welcome__main" style="display: block;">
        <div id="progress-container" style="display: none;">
            <img src="../../assets/analyzing.gif" alt="Analyzing..." />
        </div>
        <p><label id="item-subject"></label></p>
        <div id="results" style="display: none;">
            <table width="100%" class="ms-table">
                <tr><th colspan="2">RESULTS</th></tr>
                <tr><td><b>TRUST RATING:</b></td><td id="trust-rating"></td></tr>
                <tr><td><b>Address match?</b></td><td id="address-match"></td></tr>
                <tr><td><b>Sender Domain:</b></td><td id="domain"></td></tr>
                <tr><td><b>Domain Reputation:</b></td><td id="reputation"></td></tr>
                <tr><td><b>Sender Authentication:</b></td><td id="auth"></td></tr>
                <tr><td><b>Suspicious Links:</b></td><td id="links"></td></tr>
                <tr><td><b>Malicious Attachments:</b></td><td id="attachments"></td></tr>
            </table>
                    <div class="button-div">
            <button id="close" class="safe button" onclick="close()">Close to evaluate new email</button>
        </div>
        </div>

    </main>
</body>

</html>
